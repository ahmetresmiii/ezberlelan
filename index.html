<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafıza Ustası Pro</title>
    <link rel="manifest" href="manifest.json">
    <!-- Tailwind CSS ve Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React ve Babel (Tarayıcıda JSX çalıştırmak için) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;
        const { 
            Brain, Sparkles, Eye, EyeOff, Play, Pause, 
            Type, Edit3, List, RotateCcw, Volume2, VolumeX, Mic 
        } = lucide;

        // Lucide ikonlarını React bileşeni olarak kullanmak için küçük bir yardımcı
        const Icon = ({ name: IconComp, size = 20, className = "" }) => {
            return <IconComp size={size} className={className} />;
        };

        function App() {
            const [mode, setMode] = useState('input');
            const [practiceMode, setPracticeMode] = useState('cloze');
            const [content, setContent] = useState('');
            const [title, setTitle] = useState('');
            const [difficulty, setDifficulty] = useState(30);
            const [fontSize, setFontSize] = useState(18);
            const [theme, setTheme] = useState('indigo');
            const [geminiTip, setGeminiTip] = useState('');
            const [isLoadingTip, setIsLoadingTip] = useState(false);
            const [isSpeaking, setIsSpeaking] = useState(false);
            const [quizQuestion, setQuizQuestion] = useState(null);
            const [quizFeedback, setQuizFeedback] = useState(null);

            const themes = {
                indigo: 'bg-indigo-600',
                emerald: 'bg-emerald-600',
                rose: 'bg-rose-600',
                amber: 'bg-amber-600',
                slate: 'bg-slate-800'
            };

            const fetchGeminiTip = async () => {
                if (!content) return;
                setIsLoadingTip(true);
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=YOUR_API_KEY`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Bu metni ezberlemek için en iyi teknik nedir? Metin: ${content.substring(0, 500)}` }] }]
                        })
                    });
                    const data = await response.json();
                    setGeminiTip(data.candidates?.[0]?.content?.parts?.[0]?.text || "Metni bölerek çalışın.");
                } catch (e) {
                    setGeminiTip("Ritmik okuma tekniğini deneyin.");
                } finally {
                    setIsLoadingTip(false);
                }
            };

            const speak = () => {
                if (isSpeaking) { window.speechSynthesis.cancel(); setIsSpeaking(false); return; }
                const utterance = new SpeechSynthesisUtterance(content);
                utterance.lang = 'tr-TR';
                utterance.onend = () => setIsSpeaking(false);
                window.speechSynthesis.speak(utterance);
                setIsSpeaking(true);
            };

            const generateQuiz = useCallback(() => {
                const words = content.split(/\s+/).filter(w => w.length > 4);
                if (words.length < 4) { setQuizQuestion({ error: "Yeterli kelime yok." }); return; }
                const targetIdx = Math.floor(Math.random() * words.length);
                const correct = words[targetIdx].replace(/[.,;:!?]/g, "");
                const options = [correct, "elma", "kitap", "dünya"].sort(() => Math.random() - 0.5);
                setQuizQuestion({ context: `... [?] ...`, correct, options });
            }, [content]);

            const renderPracticeContent = () => {
                if (practiceMode === 'quiz') return <div class="text-center">Test Modu Aktif</div>;
                return content.split('\n').map((line, i) => (
                    <div key={i} className="mb-4 flex flex-wrap gap-2">
                        {line.split(' ').map((word, j) => (
                            <span key={j} className={Math.random() * 100 < difficulty ? 'bg-slate-200 text-transparent blur-sm' : ''}>{word} </span>
                        ))}
                    </div>
                ));
            };

            return (
                <div className="min-h-screen pb-32">
                    <nav className={`p-4 text-white shadow-lg ${themes[theme]}`}>
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2 font-bold"><Icon name={Brain} /> Hafıza Ustası Pro</div>
                            {mode === 'practice' && <button onClick={() => setMode('input')} className="bg-white/20 px-3 py-1 rounded">Geri</button>}
                        </div>
                    </nav>

                    <main className="max-w-4xl mx-auto p-4 mt-6">
                        {mode === 'input' ? (
                            <div className="bg-white p-6 rounded-3xl shadow-xl">
                                <input className="w-full text-2xl font-bold mb-4 outline-none" placeholder="Başlık..." onChange={e => setTitle(e.target.value)} />
                                <textarea className="w-full h-80 outline-none resize-none" placeholder="Metni buraya yapıştır..." onChange={e => setContent(e.target.value)} />
                                <button onClick={() => {setMode('practice'); fetchGeminiTip();}} className={`w-full py-4 text-white font-bold rounded-2xl ${themes[theme]}`}>BAŞLA</button>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="bg-white p-10 rounded-[2.5rem] shadow-2xl min-h-[400px]">
                                    <div style={{fontSize: fontSize + 'px'}}>{renderPracticeContent()}</div>
                                </div>
                                <div className="fixed bottom-6 left-4 right-4 max-w-xl mx-auto bg-white p-6 rounded-3xl shadow-2xl flex flex-col gap-4">
                                    <input type="range" min="0" max="90" value={difficulty} onChange={e => setDifficulty(e.target.value)} className="w-full" />
                                    <button onClick={speak} className="w-full py-3 bg-slate-800 text-white rounded-xl font-bold">
                                        {isSpeaking ? "DURDUR" : "SESLİ DİNLE"}
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
