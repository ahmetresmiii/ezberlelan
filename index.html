<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hafıza Ustası Pro</title>
    <!-- CSS Kütüphaneleri -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React ve Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type="range"] { accent-color: #4f46e5; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        function App() {
            const [mode, setMode] = useState('input');
            const [content, setContent] = useState('');
            const [title, setTitle] = useState('');
            const [difficulty, setDifficulty] = useState(30);
            const [fontSize, setFontSize] = useState(18);
            const [isSpeaking, setIsSpeaking] = useState(false);

            // Sesli Okuma Fonksiyonu
            const speak = () => {
                if (isSpeaking) {
                    window.speechSynthesis.cancel();
                    setIsSpeaking(false);
                    return;
                }
                const utterance = new SpeechSynthesisUtterance(content);
                utterance.lang = 'tr-TR';
                utterance.onend = () => setIsSpeaking(false);
                window.speechSynthesis.speak(utterance);
                setIsSpeaking(true);
            };

            // İçerik Oluşturucu (Kelimeleri Gizleme)
            const renderText = () => {
                return content.split('\n').map((line, i) => (
                    <div key={i} className="mb-4 flex flex-wrap gap-2">
                        {line.split(/\s+/).map((word, j) => {
                            const isHidden = ( (i + 1) * (j + 1) * 31 ) % 100 < difficulty;
                            return (
                                <span 
                                    key={j} 
                                    className={`px-1 rounded transition-all duration-300 ${isHidden ? 'bg-slate-200 text-transparent blur-sm select-none' : 'text-slate-800'}`}
                                >
                                    {word}
                                </span>
                            );
                        })}
                    </div>
                ));
            };

            return (
                <div className="min-h-screen pb-32">
                    {/* Navbar */}
                    <nav className="bg-indigo-600 p-4 text-white shadow-lg sticky top-0 z-50">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <h1 className="font-bold text-xl tracking-tight">🧠 Hafıza Ustası</h1>
                            {mode === 'practice' && (
                                <button 
                                    onClick={() => setMode('input')} 
                                    className="bg-white/20 px-4 py-2 rounded-xl text-sm font-bold"
                                >
                                    Geri Dön
                                </button>
                            )}
                        </div>
                    </nav>

                    <main className="max-w-4xl mx-auto p-4 mt-6">
                        {mode === 'input' ? (
                            <div className="bg-white p-6 rounded-3xl shadow-xl space-y-4">
                                <input 
                                    className="w-full text-2xl font-bold border-none outline-none" 
                                    placeholder="Metin Başlığı..." 
                                    value={title}
                                    onChange={e => setTitle(e.target.value)} 
                                />
                                <textarea 
                                    className="w-full h-80 border-none outline-none resize-none text-lg text-slate-600" 
                                    placeholder="Ezberlenecek metni buraya yapıştırın..." 
                                    value={content}
                                    onChange={e => setContent(e.target.value)} 
                                />
                                <button 
                                    onClick={() => setMode('practice')} 
                                    disabled={!content}
                                    className="w-full py-5 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition-all disabled:opacity-50"
                                >
                                    EZBERE BAŞLA
                                </button>
                            </div>
                        ) : (
                            <div className="space-y-6">
                                <div className="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-2xl min-h-[400px]">
                                    <h2 className="text-center text-slate-300 font-bold mb-8 uppercase tracking-widest text-xs">{title || 'Metin'}</h2>
                                    <div style={{ fontSize: fontSize + 'px' }} className="leading-relaxed font-medium">
                                        {renderText()}
                                    </div>
                                </div>

                                {/* Kontrol Paneli */}
                                <div className="fixed bottom-6 left-4 right-4 max-w-xl mx-auto bg-white/90 backdrop-blur-md p-6 rounded-3xl shadow-2xl flex flex-col gap-4 border border-white">
                                    <div className="flex justify-between text-xs font-bold text-slate-400">
                                        <span>ZORLUK</span>
                                        <span>%{difficulty} Gizli</span>
                                    </div>
                                    <input 
                                        type="range" min="0" max="90" step="10" 
                                        value={difficulty} 
                                        onChange={e => setDifficulty(e.target.value)} 
                                        className="w-full cursor-pointer" 
                                    />
                                    <div className="flex gap-4">
                                        <button 
                                            onClick={speak} 
                                            className={`flex-1 py-4 rounded-2xl font-bold transition-all ${isSpeaking ? 'bg-red-500 text-white' : 'bg-slate-800 text-white'}`}
                                        >
                                            {isSpeaking ? '🛑 DURDUR' : '🔊 SESLİ DİNLE'}
                                        </button>
                                        <div className="flex bg-slate-100 rounded-2xl p-1">
                                            <button onClick={() => setFontSize(f => Math.max(12, f - 2))} className="px-4 font-bold">-</button>
                                            <button onClick={() => setFontSize(f => Math.min(32, f + 2))} className="px-4 font-bold">+</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
